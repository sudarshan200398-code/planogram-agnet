[theme]
base = "light"
primaryColor = "#0F5257"
backgroundColor = "#F5F7F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2A30"
borderColor = "#D9E0E3"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
