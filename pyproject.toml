[project]
name = "planogram-agent"
version = "0.1.0"
description = "Agentic store product finder: availability + shortest path across a multi-floor store"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "networkx>=3.0", "matplotlib>=3.7", "rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff"]
ui = ["streamlit>=1.30"]
api = ["fastapi==0.143.3", "uvicorn==0.54.0", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "slow: marks slow full-dataset scan tests (deselect with '-m \"not slow\"')",
    "live: marks tests that make live network calls (deselect with '-m \"not live\"')",
]
addopts = '-m "not slow and not live"'
